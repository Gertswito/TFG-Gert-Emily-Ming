<div class="body-entidades">
    <h1 class="titulo">Direcciones</h1>

    @if (direccionList.length > 0) {
        <table class="table table-striped table-bordered">
            <thead>
                <tr class="table-primary">
                    <th>ID</th>
                    <th>Código postal</th>
                    <th>Calle</th>
                    <th>Localidad</th>
                    <th>Comunidad autónoma</th>
                    <th>Cliente</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let direccion of direccionList">
                    <tr>
                        <td>{{direccion.id}}</td>
                        <td>{{direccion.codigoPostal}}</td>
                        <td>{{direccion.direccion}}</td>
                        <td>{{direccion.localidad}}</td>
                        <td>{{direccion.comunidadAutonoma}}</td>
                        <td>{{direccion.cliente?.usuario}}</td>
                        <td>
                          <button class="btn btn-primary" (click)="editarDireccion(direccion)" title="Editar Dirección">
                            <i class="bi bi-pencil"></i> <!-- Icono de editar -->
                        </button>
                        <button class="btn btn-danger" (click)="eliminarDireccion(direccion)" title="Eliminar Dirección">
                            <i class="bi bi-trash"></i> <!-- Icono de papelera -->
                        </button>
                      </td>

                    </tr>
                </ng-container>
            </tbody>
        </table>
    } @else {
        <p>NADA</p>
    }
</div>
