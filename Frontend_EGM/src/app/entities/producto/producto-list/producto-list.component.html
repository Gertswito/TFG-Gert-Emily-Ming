<div class="body-entidades">
    <h1 class="titulo">{{nombreSubcategoria}}</h1>
  
    @if (productoList.length > 0) {
        <div class="cards-productos">
            <ng-container *ngFor="let producto of productoList">
                <div class="card-producto categoria-{{producto.categoria?.id}}">
                    <div class="header-nombre d-flex justify-content-center align-items-center">
                        <h5 class="text-center">{{producto.marca}} - {{producto.nombre}}</h5>
                    </div>
                    <div class="div-imagen-producto d-flex justify-content-center align-items-center">
                        <img [src]="producto.urlImagen" alt="" class="imagen-productos">
                    </div>
                    <div class="d-flex flex-row justify-content-between align-items-end">
                        <div>
                            <a [routerLink]="'/producto-info'" [queryParams]="{ id: producto.id }">
                                <button type="button" class="btn btn-secondary">Ver producto</button>
                            </a>
                        </div>
                        <div class="d-flex flex-column align-items-end mt-3">
                            <span class="mb-3">Precio: {{producto.precio | number:'1.2-2'}}€</span>
                            <button type="button" class="btn btn-primary" (click)="addCarrito(producto)" [disabled]="usuario == null || usuario == undefined">Añadir al carrito</button>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>
    } @else {
        <p>NADA</p>
    }
  </div>
